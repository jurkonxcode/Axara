<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan — Axara</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body data-page="settings">

  <div class="app-layout">
    <aside class="sidebar-left" id="sidebarLeft"></aside>
    <main class="main-content">
      <div class="mobile-header" id="mobileHeader"></div>
      <div class="desktop-header">
        <span class="page-title">Pengaturan</span>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Akun</div>
        <div class="settings-item" id="itemEditProfile">
          <div class="settings-item-icon">✏️</div>
          <div class="settings-item-body">
            <div class="settings-item-title">Edit Profil</div>
            <div class="settings-item-desc">Ubah nama, bio, lokasi, dan website</div>
          </div>
          <div class="settings-item-arrow">›</div>
        </div>
        <div class="settings-item" id="itemChangePassword">
          <div class="settings-item-icon">🔒</div>
          <div class="settings-item-body">
            <div class="settings-item-title">Ganti Kata Sandi</div>
            <div class="settings-item-desc">Kirim link reset ke email</div>
          </div>
          <div class="settings-item-arrow">›</div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Preferensi</div>
        <div class="settings-item" id="itemTheme">
          <div class="settings-item-icon">🌙</div>
          <div class="settings-item-body">
            <div class="settings-item-title">Tema</div>
            <div class="settings-item-desc">Saat ini: Gelap (default)</div>
          </div>
          <div class="settings-item-arrow">›</div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Info</div>
        <div class="settings-item">
          <div class="settings-item-icon">ℹ️</div>
          <div class="settings-item-body">
            <div class="settings-item-title">Axara.app</div>
            <div class="settings-item-desc">Versi 1.0.0</div>
          </div>
        </div>
        <div class="settings-item" id="itemLogout">
          <div class="settings-item-icon">🚪</div>
          <div class="settings-item-body">
            <div class="settings-item-title" style="color: var(--like);">Keluar</div>
            <div class="settings-item-desc">Logout dari akun ini</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Edit Profil -->
  <div class="modal-overlay" id="editProfileModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Profil</h3>
        <button class="modal-close" data-close="editProfileModal">×</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>Nama Tampilan</label>
          <input type="text" id="editName" maxlength="50">
        </div>
        <div class="input-group">
          <label>Bio</label>
          <textarea id="editBio" maxlength="160" placeholder="Ceritakan tentang dirimu..."></textarea>
        </div>
        <div class="input-group">
          <label>Lokasi</label>
          <input type="text" id="editLocation" maxlength="30" placeholder="Jakarta, Indonesia">
        </div>
        <div class="input-group">
          <label>Website</label>
          <input type="text" id="editWebsite" maxlength="100" placeholder="https://...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-close="editProfileModal">Batal</button>
        <button class="btn btn-primary" id="btnSaveProfile">Simpan</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <script src="script.js"></script>
</body>
</html>
