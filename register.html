<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Axara</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="auth-page" data-page="register">
<div class="auth-container">
  <div class="auth-card">
    <a href="index.html" class="logo">
      <span class="logo-mark">A</span>
      <span class="logo-text">Axara</span>
    </a>
    <h1>Buat Akun Baru</h1>
    <p class="auth-sub">Bergabung dan mulai bicara bebas.</p>
    <form id="registerForm">
      <div class="input-group">
        <label for="displayName">Nama Tampilan</label>
        <input type="text" id="displayName" placeholder="Nama Anda" required maxlength="50">
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="input-group">
        <label for="password">Kata Sandi (min. 6 karakter)</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btnSubmit">Daftar</button>
    </form>
    <p class="auth-footer">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    <p id="message" class="auth-message"></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
